# ZBC — the reference/testing machine used by picolibc's MOS port.
# Runs under MAME's zbcm6502 driver.

name         = "zbc"
display_name = "ZBC (MAME zbcm6502)"
cpu          = "6502"
endianness   = "little"

# Rough memory map — authoritative details live in linker/memory.ld.
[memory]
description = "63 KB RAM at 0x0000-0xFCDF, semihost device 0xFCE0-0xFCFF, vectors at 0xFFFA"

[emulator]
# Canonical runner declarations live in runners.cmake — this section is
# purely descriptive for humans and future tooling. picomos_run() reads
# runners.cmake, not this file.
supported = ["mame"]
default   = "mame"

[emulator.mame]
driver = "zbcm6502"
notes  = "No external ROMs required; the zbcm6502 driver is a bare-metal 6502 with a MMIO semihost device at 0xFCE0."
