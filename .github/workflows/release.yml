name: release

# Two-stage build:
#
#   Job A (linux only): produces picolibc-mos.tar.xz — the MOS-target
#     artifacts (headers + libc.a + libm.a). meson runs HERE and only
#     here; picolibc's build story is Linux-tested.
#
#   Job B (matrix: linux, macos, windows): downloads a prebuilt llvm-mos
#     for the runner's host + the picolibc tarball from Job A, then runs
#     `cmake --install` in PREBUILT mode to assemble the sysroot and
#     write the clang config files. No meson runs on macOS or Windows.
#
# The result is three per-host bundles, all containing the same
# host-independent MOS target artifacts.

on:
  push:
    branches: [main]     # rolling `nightly` prerelease on every commit
    tags:     ['v*']     # semver publish on tag push
  workflow_dispatch:     # manual run; builds artifacts but does not publish

# One in-flight build per ref. A newer push to main cancels the older
# ~2-hour build; tag pushes are their own group and never step on each
# other or on main-branch runs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the source refs we ship. Reproducible-from-source is the point;
  # build takes ~40-60 min on Job A but only runs on tags.
  LLVM_MOS_REF:       'main'        # TODO: pin to a specific SHA per release
  # Fetched from PICOMOS_PICOLIBC_REPOSITORY (defaults to
  # johnwbyrd/picolibc, the picomos-maintained fork with MOS support —
  # upstream picolibc has no MOS arch yet). Branch, not tag; the fork
  # rebases onto upstream periodically and re-tags this branch name.
  PICOLIBC_VERSION:   'feature/upstream-rebase-2026-09'

jobs:

  # ------------------------------------------------------------------ Job A
  target-picolibc:
    name: Build picolibc-mos from source (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install meson + ninja
        run: |
          pipx install meson
          pipx install ninja

      # Build llvm-mos AND picolibc from source. This is the slow path
      # (~40-60 min) but produces a fully reproducible artifact that
      # depends only on the pinned llvm-mos ref and picolibc version.
      - name: Configure picomos (build llvm-mos + picolibc from source)
        run: |
          cmake -B build -G Ninja \
            -DPICOMOS_LLVM_MOS_REF=${{ env.LLVM_MOS_REF }} \
            -DPICOMOS_PICOLIBC_REF=${{ env.PICOLIBC_VERSION }} \
            -DCMAKE_INSTALL_PREFIX=$PWD/stage

      - name: Build llvm-mos + picolibc
        run: cmake --build build --target picolibc-mos

      - name: Package picolibc-mos.tar.xz
        run: cmake --build build --target picolibc-mos-tarball

      - uses: actions/upload-artifact@v4
        with:
          name: picolibc-mos
          path: build/picolibc-mos.tar.xz

  # ------------------------------------------------------------------ Job B
  bundle:
    name: Bundle picomos (${{ matrix.host }})
    needs: target-picolibc
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: linux-x86_64
            archive: tar.xz
          - os: macos-latest
            host: macos-arm64
            archive: tar.xz
          - os: windows-latest
            host: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest

      - name: Download picolibc-mos tarball from Job A
        uses: actions/download-artifact@v4
        with:
          name: picolibc-mos
          path: prebuilt/

      # Derive PICOMOS_VERSION for this build. Three sources, in priority:
      #
      #   tag push v1.2.3    -> 1.2.3                (semver release)
      #   push to main       -> nightly              (rolling prerelease)
      #   workflow_dispatch  -> 0.0.0-dev.<sha7>     (no publish; for testing)
      #
      # Archive filenames pick this up via -DPICOMOS_VERSION, so the
      # release download URLs stay predictable:
      #   .../releases/download/v1.2.3/picomos-1.2.3-linux-x86_64.tar.xz
      #   .../releases/download/nightly/picomos-nightly-linux-x86_64.tar.xz
      - name: Derive version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v(.+)$ ]]; then
            echo "value=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "value=nightly" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # llvm-mos binaries are host-specific, so each matrix runner builds
      # llvm-mos natively from source at the pinned ref. picolibc is
      # host-independent and comes from Job A's tarball — no meson runs
      # on this host, so the macOS/Windows meson gap is irrelevant.
      - name: Configure picomos (build llvm-mos here, reuse picolibc tarball)
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DPICOMOS_LLVM_MOS_REF=${{ env.LLVM_MOS_REF }} \
            -DPICOMOS_PICOLIBC_PREBUILT=$PWD/prebuilt/picolibc-mos.tar.xz \
            -DPICOMOS_INSTALL_TOOLCHAIN=ON \
            -DPICOMOS_HOST_LABEL=${{ matrix.host }} \
            -DPICOMOS_VERSION=${{ steps.version.outputs.value }}

      - name: Build machine overlays + config files
        run: cmake --build build

      # CPack runs its own cmake --install into a staging dir, then
      # compresses to TXZ (Linux/macOS) or ZIP (Windows) per the
      # generator selected in the top-level CMakeLists.txt based on
      # CMAKE_HOST_SYSTEM_NAME. Archive lands at build/picomos-*.<ext>.
      - name: Package (cpack)
        run: cmake --build build --target package

      - uses: actions/upload-artifact@v4
        with:
          name: picomos-${{ matrix.host }}
          path: build/picomos-*.${{ matrix.archive }}

  # ----------------------------------------------------------------- release
  #
  # Two publish modes, driven by the ref that triggered the run:
  #
  #   Tag push (refs/tags/v*)      -> Permanent release named after the
  #                                    tag. --generate-notes fills the
  #                                    body from commits since the
  #                                    previous release.
  #   Main push (refs/heads/main)  -> Rolling `nightly` prerelease. Old
  #                                    release + tag are deleted first
  #                                    so the URLs stay stable:
  #                                    .../releases/download/nightly/
  #                                    picomos-nightly-<host>.<ext>
  #   Anything else                -> Job skipped (workflow_dispatch,
  #                                    feature branches).
  #
  # `gh release create` needs contents: write — the workflow-level
  # default token has read-only scope, so we grant it explicitly for
  # this job only.
  release:
    name: Publish release
    needs: bundle
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: picomos-*
          merge-multiple: true

      - name: Inspect downloaded artifacts
        run: |
          echo "Artifacts to publish:"
          ls -la picomos-*.tar.xz picomos-*.zip

      - name: Publish semver release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
              --repo   "$GITHUB_REPOSITORY" \
              --title  "picomos $TAG" \
              --generate-notes \
              picomos-*.tar.xz picomos-*.zip

      - name: Publish rolling nightly (main push)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the previous nightly release + tag so the assets are
          # replaced cleanly. --cleanup-tag removes the git tag too;
          # || true guards the very first run when nightly doesn't
          # exist yet.
          gh release delete nightly \
              --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag --yes 2>/dev/null || true

          DATE="$(date -u +%Y-%m-%d)"
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create nightly \
              --repo   "$GITHUB_REPOSITORY" \
              --title  "picomos nightly ($DATE, $SHORT_SHA)" \
              --notes  "Rolling build from \`main\`. This release is overwritten on every push — download URLs stay stable but contents change. For pinned releases, look for tagged \`v*\` releases." \
              --prerelease \
              --target "$GITHUB_SHA" \
              picomos-*.tar.xz picomos-*.zip
